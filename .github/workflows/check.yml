name: check

on:
  push:
    branches: [chezmoi]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: >-
            --check
            --config-path dot_config/nvim/.stylua.toml
            dot_config/nvim/lua dot_config/nvim/lsp

  chezmoi-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned chezmoi
        env:
          CHEZMOI_VERSION: 2.70.4
          CHEZMOI_SHA256: 7382f585d35647ebb492bd6345466e7f35564068b78285bb029cb2f35056ecf4
        run: |
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$archive"
          echo "$CHEZMOI_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" chezmoi
          sudo install -m 0755 "$RUNNER_TEMP/chezmoi" /usr/local/bin/chezmoi
      - name: Render, apply in isolation, and verify
        run: |
          export HOME="$RUNNER_TEMP/chezmoi home"
          mkdir -p "$HOME"
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$HOME" \
            --refresh-externals=never --no-tty --dry-run apply
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$HOME" \
            --refresh-externals=never --no-tty apply
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$HOME" verify
          grep -Fx "style: \"$HOME/.config/glow/catppuccin-mocha.json\"" \
            "$HOME/.config/glow/glow.yml"
          test -f "$HOME/.config/glow/catppuccin-mocha.json"

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.12.5, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: npm install --global tree-sitter-cli@0.27.0
      - run: ./dot_config/nvim/test.sh --ci
